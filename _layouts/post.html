<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Brian Kibet</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/normalize.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://kit.fontawesome.com/56bf1872c9.js" crossorigin="anonymous"></script>
</head>
<body>
    {% include nav.html %}

    <div id="blog">
        <div class="container">
            <div id="blog-content">
                <h1>{{ page.title }}</h1>
                <p>Published on: {{ page.date | date_to_string }}</p>
                {{ content }}
            </div>
            <a href="{{ site.baseurl }}/blog" class="back-to-blog">&larr; Back to Blog</a>
        </div>
    </div>

    {% include footer.html %}

    {% include menu-script.html %}
</body>
</html>
